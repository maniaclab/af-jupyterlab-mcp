{{/*
Read-only, cluster-scoped: GPU-availability parity with the portal's
cluster-wide accounting (get_gpu_availability sums GPU requests across ALL
namespaces on GPU-labeled nodes, not just the notebook namespace -- a
namespace-local approximation would undercount whenever non-notebook
workloads share a GPU node).
*/}}
{{- if .Values.rbac.clusterRoleCreate -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "jupyterlab-mcp.fullname" . }}-gpu-availability
  labels:
    {{- include "jupyterlab-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
{{- end }}
