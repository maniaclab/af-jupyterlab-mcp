# Default values for af-jupyterlab-mcp.
#
# Unlike ami-mcp's chart (which installs ami-mcp at pod startup via pixi from
# a conda-forge release, since ami-mcp publishes no OCI image), this chart
# expects a prebuilt container image: af-jupyterlab-mcp has no published
# package or image yet (repo creation and CI/CD are deferred -- see the
# phase-1 report on af-mcp-platform#189). Point image.repository/tag at
# whatever a human builds and pushes once the repo exists.
image:
  repository: ghcr.io/maniaclab/af-jupyterlab-mcp
  tag: "0.1.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# -- af-jupyterlab-mcp / uvicorn log level: debug | info | warning | error.
logLevel: info

# -- IPs trusted for X-Forwarded-* headers. "*" trusts the in-cluster ingress/aggregator.
forwardedAllowIps: "*"

server:
  # Bind address inside the pod.
  host: "0.0.0.0"
  # Container port for the MCP HTTP endpoint (also serves /healthz).
  port: 8000
  # Public URL clients reach the server at (--resource-url). Empty = the
  # server falls back to http://<host>:<port> (fine behind the aggregator,
  # which is the only expected caller -- see ingress.enabled below).
  resourceUrl: ""

# -- The notebook namespace and per-notebook settings this backend manages.
# See af-mcp-platform#189 open question 1: this MUST be a namespace
# dedicated to notebooks (holding nothing else) -- the `secrets` RBAC grant
# below is only safe under that assumption.
notebook:
  namespace: jupyterlab
  # DNS domain notebooks are exposed under: <notebook-id>.<domain>.
  domain: notebooks.af.uchicago.edu

  # Image allowlists, split by workload shape. create_jupyter_server rejects
  # any image not in the union of these two lists. Bumping an image is a
  # values change, not a af-jupyterlab-mcp release.
  images:
    cpu:
      - hub.opensciencegrid.org/usatlas/ml-platform-cpu:latest
      - hub.opensciencegrid.org/usatlas/ml-platform:2026.3
    gpu:
      - hub.opensciencegrid.org/usatlas/ml-platform-gpu:latest
      - hub.opensciencegrid.org/usatlas/ml-platform:2026.3

  # Optional per-owner quota knobs (decision 4 in af-mcp-platform#189: OFF by
  # default -- no default max-servers-per-user, no default GPU count cap
  # beyond the range guardrails below). Set a positive integer to enable.
  quotas:
    maxServersPerUser: ""
    maxGpusPerRequest: ""

# NOTE: the CPU/memory/duration RANGE guardrails (1-16 cores, 1-256Gi,
# 1-72h) and the limit=2x-request rule are NOT chart values -- they are
# always-enforced validation, not configurable quota, per af-mcp-platform
# issue #189. See src/af_jupyterlab_mcp/config.py.

# -- AF credential broker wiring. This backend's ONLY auth mode is
# broker-issued bearer JWTs (auth_type: bearer, type: broker-issued,
# audience: af-jupyterlab-mcp, includePosix: true) -- there is no
# shared-secret fallback the way ami-mcp has one.
broker:
  # AF credential broker base URL (required; env JUPYTERLAB_MCP_BROKER_URL).
  brokerUrl: ""
  # JWKS URL for verifying broker-issued JWTs. Empty = derived by the server
  # as <brokerUrl>/.well-known/jwks.json.
  jwksUrl: ""
  # Expected iss claim of broker-issued JWTs. Empty = brokerUrl.
  issuer: ""
  # Expected aud claim of broker-issued JWTs.
  audience: "af-jupyterlab-mcp"

# -- Extra environment variables for the main container (free-form list of
# corev1.EnvVar). Use for settings the chart does not template.
extraEnv: []

# -- Disabled by default: the expected caller is the af-mcp-platform
# aggregator, in-cluster, via the Service below -- not a public ingress.
# Enable only if you need to reach this backend directly.
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Namespace Role in notebook.namespace (pods/services/secrets
  # get+list+create+delete, pods/log get, events list, ingresses
  # get+list+create+delete), bound cross-namespace to this release's
  # ServiceAccount. See the two RBAC caveats in af-mcp-platform#189: RBAC
  # cannot scope by label selector (owner-checks are application-level),
  # and the notebook namespace must hold nothing but notebooks.
  create: true
  # Read-only ClusterRole (nodes get+list, pods list across namespaces) for
  # GPU-availability parity with the portal's cluster-wide accounting.
  clusterRoleCreate: true

# NOTE: no ServiceMonitor/Grafana dashboard -- af-jupyterlab-mcp exposes no
# /metrics endpoint yet (ami-mcp parity).

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod-level securityContext (rendered as-is via toYaml).
podSecurityContext: {}

# -- Container-level securityContext (rendered as-is via toYaml). Unlike
# ami-mcp's chart (which runs a pixi-install init step that may need root),
# af-jupyterlab-mcp's own container is a plain Python process with no local
# package install step, so a non-root, read-only-rootfs profile is safe --
# override runAsNonRoot/readOnlyRootFilesystem if your built image needs
# otherwise.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
