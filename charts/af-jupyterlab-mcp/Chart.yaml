apiVersion: v2
name: af-jupyterlab-mcp
description: |
  MCP server exposing per-user JupyterLab server management (create/list/get/
  delete, GPU availability, supported images) on the ATLAS AF Kubernetes
  cluster, served over HTTP transport behind the AF credential broker.
type: application
# Chart version, kept in lockstep with appVersion by tbump.toml.
version: 0.1.0
# af-jupyterlab-mcp release the chart deploys by default (the image tag
# pinned in values.yaml). Override with image.tag in values.
appVersion: "0.1.0"
keywords:
  - jupyterlab
  - mcp
  - atlas
  - kubernetes
home: https://github.com/maniaclab/af-jupyterlab-mcp
sources:
  - https://github.com/maniaclab/af-jupyterlab-mcp
maintainers:
  - name: Giordon Stark
    email: kratsg@gmail.com
