{{- if .Values.rbac.clusterRoleCreate -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "af-jupyterlab-mcp.fullname" . }}-gpu-availability
  labels:
    {{- include "af-jupyterlab-mcp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "af-jupyterlab-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "af-jupyterlab-mcp.fullname" . }}-gpu-availability
  apiGroup: rbac.authorization.k8s.io
{{- end }}
