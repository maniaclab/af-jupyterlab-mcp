apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "af-jupyterlab-mcp.fullname" . }}
  labels:
    {{- include "af-jupyterlab-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "af-jupyterlab-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "af-jupyterlab-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "af-jupyterlab-mcp.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["af-jupyterlab-mcp"]
          args:
            {{- include "af-jupyterlab-mcp.serveArgs" . | nindent 12 }}
          env:
            - name: JUPYTERLAB_MCP_BROKER_URL
              value: {{ .Values.broker.brokerUrl | quote }}
            - name: JUPYTERLAB_MCP_NAMESPACE
              value: {{ .Values.notebook.namespace | quote }}
            - name: JUPYTERLAB_MCP_DOMAIN
              value: {{ .Values.notebook.domain | quote }}
            {{- if .Values.notebook.images.cpu }}
            - name: JUPYTERLAB_MCP_CPU_IMAGES
              value: {{ .Values.notebook.images.cpu | join "," | quote }}
            {{- end }}
            {{- if .Values.notebook.images.gpu }}
            - name: JUPYTERLAB_MCP_GPU_IMAGES
              value: {{ .Values.notebook.images.gpu | join "," | quote }}
            {{- end }}
            {{- if .Values.notebook.quotas.maxServersPerUser }}
            - name: JUPYTERLAB_MCP_MAX_SERVERS_PER_USER
              value: {{ .Values.notebook.quotas.maxServersPerUser | quote }}
            {{- end }}
            {{- if .Values.notebook.quotas.maxGpusPerRequest }}
            - name: JUPYTERLAB_MCP_MAX_GPUS_PER_REQUEST
              value: {{ .Values.notebook.quotas.maxGpusPerRequest | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
