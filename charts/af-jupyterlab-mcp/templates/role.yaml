{{/*
Namespace Role in the notebook namespace (NOT the release namespace this
Deployment runs in -- see rolebinding.yaml for the cross-namespace bind).

One honest caveat (af-mcp-platform#189):
  RBAC cannot scope by label selector -- the owner= label check is
  application-level (see af_jupyterlab_mcp.k8s.notebooks), not enforced here.

No `secrets` grant is needed: the JupyterLab token is stored only in the
pod's JUPYTER_TOKEN env var and read back directly from the pod spec on
get_jupyter_server(include_url=True) -- no Secret object is created or read.
*/}}
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "af-jupyterlab-mcp.fullname" . }}-notebooks
  namespace: {{ .Values.notebook.namespace }}
  labels:
    {{- include "af-jupyterlab-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete"]
{{- end }}
