{{/*
Namespace Role in the notebook namespace (NOT the release namespace this
Deployment runs in -- see rolebinding.yaml for the cross-namespace bind).

Two honest caveats (af-mcp-platform#189):
  1. RBAC cannot scope by label selector -- the owner= label check is
     application-level (see af_jupyterlab_mcp.k8s.notebooks), not enforced here.
  2. The `secrets` grant is the scariest part of this Role; it is only safe
     because notebook.namespace is assumed to hold nothing but notebooks
     (open question 1 in the issue -- verify before granting this in prod).
*/}}
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "af-jupyterlab-mcp.fullname" . }}-notebooks
  namespace: {{ .Values.notebook.namespace }}
  labels:
    {{- include "af-jupyterlab-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]
{{- end }}
